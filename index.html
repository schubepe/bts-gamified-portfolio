      /*
        These are only the critical loading styles.

        Your detailed portfolio styling should still be placed
        inside your main CSS files under /src.
      */

      :root {
        color-scheme: light;

        --page-background: #f4f2fb;
        --page-background-secondary: #e7efff;

        --text-primary: #25243a;
        --text-secondary: #68677d;

        --glass-background: rgba(255, 255, 255, 0.42);
        --glass-border: rgba(255, 255, 255, 0.72);

        --holographic-pink: #ffb8db;
        --holographic-blue: #a9d6ff;
        --holographic-lavender: #c8bbff;
        --holographic-mint: #b9f3e4;

        --navigation-background: rgba(244, 242, 251, 0.5);
        --loading-background: #eeecf7;
      }

      /*
        Supports portfolios using:
        html[data-theme="dark"]
        html.dark
        body.dark
        or the device's dark-mode preference.
      */

      html[data-theme="dark"],
      html.dark,
      body.dark {
        color-scheme: dark;

        --page-background: #080910;
        --page-background-secondary: #121324;

        --text-primary: #f7f5ff;
        --text-secondary: #aaa8bd;

        --glass-background: rgba(16, 18, 32, 0.46);
        --glass-border: rgba(216, 222, 255, 0.16);

        --holographic-pink: #ff85c7;
        --holographic-blue: #79c8ff;
        --holographic-lavender: #aa92ff;
        --holographic-mint: #6ee7cf;

        --navigation-background: rgba(8, 9, 16, 0.56);
        --loading-background: #0e0f19;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
        background: var(--page-background);
      }

      body {
        position: relative;
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;

        font-family:
          "SFMono-Regular",
          "Cascadia Code",
          "Roboto Mono",
          "IBM Plex Mono",
          Consolas,
          monospace;

        line-height: 1.6;
        letter-spacing: -0.015em;

        color: var(--text-primary);
        background:
          radial-gradient(
            circle at 12% 10%,
            rgba(255, 184, 219, 0.28),
            transparent 30%
          ),
          radial-gradient(
            circle at 88% 16%,
            rgba(169, 214, 255, 0.3),
            transparent 34%
          ),
          radial-gradient(
            circle at 50% 88%,
            rgba(185, 243, 228, 0.21),
            transparent 35%
          ),
          linear-gradient(
            145deg,
            var(--page-background),
            var(--page-background-secondary)
          );

        background-attachment: fixed;
        transition:
          color 350ms ease,
          background-color 350ms ease;
      }

      /*
        Soft holographic film over the page.
        pointer-events keeps it from blocking buttons and links.
      */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;

        background:
          linear-gradient(
            115deg,
            transparent 10%,
            rgba(255, 255, 255, 0.2) 31%,
            rgba(255, 184, 219, 0.12) 42%,
            rgba(169, 214, 255, 0.14) 54%,
            rgba(185, 243, 228, 0.1) 66%,
            transparent 82%
          );

        background-size: 220% 220%;
        opacity: 0.75;
        animation: holographic-shift 14s ease-in-out infinite alternate;
      }

      #root {
        min-height: 100vh;
        isolation: isolate;
      }

      /* Navigation loading style */

      .navigation {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;

        padding: 1rem 0;

        background: var(--navigation-background);
        border-bottom: 1px solid var(--glass-border);
        backdrop-filter: blur(24px) saturate(150%);

        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.08),
          0 14px 45px rgba(26, 22, 55, 0.08);
      }

      .main-content {
        padding-top: 80px;
      }

      /* First section loading style */

      .about-section {
        position: relative;
        min-height: 100vh;
        padding: 2rem 0;

        background:
          radial-gradient(
            circle at 50% 25%,
            rgba(255, 184, 219, 0.16),
            transparent 38%
          ),
          radial-gradient(
            circle at 65% 70%,
            rgba(169, 214, 255, 0.17),
            transparent 40%
          );
      }

      .container {
        width: min(1200px, calc(100% - 3rem));
        margin: 0 auto;
      }

      .text-center {
        text-align: center;
      }

      /* Lazy-loading fallback */

      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 200px;

        color: var(--text-secondary);
        background: var(--glass-background);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        backdrop-filter: blur(22px);
      }

      /* Performance helpers */

      .will-change-transform {
        will-change: transform;
      }

      .will-change-opacity {
        will-change: opacity;
      }

      .gpu-accelerated {
        transform: translateZ(0);
      }

      img,
      picture {
        content-visibility: auto;
        contain-intrinsic-size: 0 200px;
      }

      @keyframes holographic-shift {
        0% {
          background-position: 0% 40%;
          filter: hue-rotate(0deg);
        }

        100% {
          background-position: 100% 60%;
          filter: hue-rotate(12deg);
        }
      }

      /*
        Reduces movement for visitors who have disabled animation
        in their device accessibility settings.
      */

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
